<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --fg: #24292f;
    --fg-muted: #57606a;
    --bg: #ffffff;
    --border: #d0d7de;
    --code-bg: #f6f8fa;
    --link: #0969da;
    --quote-border: #d0d7de;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 32px 48px;
    max-width: 880px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, h5, h6 {
    margin: 1.6em 0 0.6em;
    line-height: 1.25;
    font-weight: 600;
  }
  h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1em; }
  h5 { font-size: 0.875em; color: var(--fg-muted); }
  h6 { font-size: 0.85em; color: var(--fg-muted); }
  p { margin: 0 0 1em; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 2em; margin: 0 0 1em; }
  li { margin: 0.2em 0; }
  blockquote {
    margin: 0 0 1em;
    padding: 0 1em;
    border-left: 4px solid var(--quote-border);
    color: var(--fg-muted);
  }
  code {
    font-family: "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0.18em 0.4em;
    border-radius: 4px;
  }
  pre {
    background: var(--code-bg);
    border-radius: 6px;
    padding: 14px 16px;
    overflow: auto;
    line-height: 1.45;
    margin: 0 0 1em;
  }
  pre code {
    background: transparent;
    padding: 0;
    border-radius: 0;
    font-size: 0.875em;
  }
  table {
    border-collapse: collapse;
    margin: 0 0 1em;
    width: auto;
    display: block;
    overflow-x: auto;
  }
  table th, table td { border: 1px solid var(--border); padding: 6px 12px; }
  table th { background: var(--code-bg); font-weight: 600; }
  table tr:nth-child(2n) { background: #fafbfc; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
  img { max-width: 100%; height: auto; }
  @media print {
    body { padding: 24px 0; max-width: none; }
  }
</style>
</head>
<body>
<article>
{{CONTENT}}
</article>
</body>
</html>
